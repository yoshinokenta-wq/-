<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 3.8 Live リアルタイム音声チャットデモ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎙️ Gemini 3.8 Live デモ</h1>
      <p>Ruby (Sinatra + Puma) バックエンドによるリアルタイム双方向音声チャット</p>
    </header>

    <!-- Main Status and Controls -->
    <section class="status-card">
      <div class="status-indicator">
        <div id="status-dot" class="pulsing-dot"></div>
        <div class="status-info">
          <h2 id="status-text">未接続</h2>
          <span id="status-subtext">「会話を開始」ボタンを押してください</span>
        </div>
      </div>
      <div class="controls-group">
        <button id="start-btn" class="btn btn-primary">▶ 会話を開始</button>
        <button id="stop-btn" class="btn btn-danger" disabled>⏹ 停止</button>
      </div>
    </section>

    <!-- Audio Wave Visualizer -->
    <section class="visualizer-card">
      <div id="wave-visualizer" class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </section>

    <!-- Voice Activity Detection (VAD) & Silence Monitor -->
    <section class="vad-monitor-card">
      <div class="vad-header">
        <span>マイク入力 & 無音判定 (VAD) モニター</span>
        <div class="vad-badges">
          <span id="vad-badge" class="badge">待機中</span>
        </div>
      </div>

      <!-- Volume Meter -->
      <div class="meter-wrapper">
        <div class="meter-labels">
          <span>マイク入力音量: <strong id="volume-rms-text">0.000</strong> (<span id="packets-sent-text">0</span> パケット送信)</span>
          <span id="sample-rate-text">16kHz</span>
        </div>
        <div class="meter-track">
          <div id="meter-fill" class="meter-fill"></div>
          <div id="threshold-line" class="meter-threshold-line"></div>
        </div>
      </div>

      <!-- Silence Duration Countdown Bar -->
      <div class="silence-timer-wrapper">
        <div class="meter-labels">
          <span>無音継続タイマー</span>
          <span id="silence-progress-text">待機中 (500ms無音でターン終了)</span>
        </div>
        <div class="silence-track">
          <div id="silence-fill" class="silence-fill"></div>
        </div>
      </div>

      <!-- Settings Sliders -->
      <div class="settings-grid">
        <div class="slider-group">
          <label>
            <span>無音しきい値 (感度)</span>
            <span id="threshold-val">0.010</span>
          </label>
          <input id="threshold-slider" type="range" min="0.002" max="0.080" step="0.002" value="0.010">
        </div>
        <div class="slider-group">
          <label>
            <span>無音判定時間 (ターン交代)</span>
            <span id="duration-val">500 ms</span>
          </label>
          <input id="duration-slider" type="range" min="300" max="2000" step="50" value="500">
        </div>
      </div>
    </section>

    <!-- Chat and Transcript Area -->
    <section class="chat-card">
      <div class="chat-header">
        <h3>💬 リアルタイム会話ログ</h3>
      </div>
      <div id="chat-logs" class="chat-logs">
        <div class="log-entry system">
          <span class="sender">システム</span>
          <span class="content">デモアプリが準備できました。「会話を開始」を押すと、Geminiから最初の挨拶が始まります。</span>
        </div>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script src="/js/audio-player.js"></script>
  <script src="/js/audio-recorder.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
