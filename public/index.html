<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面接練習＆学習アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 1. トップ画面 ===== -->
  <div class="main-container" id="top-screen">
    <div class="title-ui">
      <h1 class="title-img">面接練習 ＆ 学習アプリ</h1>
    </div>
    <div class="menu-buttons">
      <button class="btn" onclick="switchScreen('interview-screen')">面接練習モード</button>
      <button class="btn" onclick="switchScreen('vocab-screen')">単語帳モード</button>
      <button class="btn" onclick="switchScreen('ordering-screen')">並び替えモード</button>
      <button class="btn" onclick="openModal('settings-modal')">設定</button>
    </div>
  </div>

  <!-- ===== 2. 設定モーダル ===== -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title">環境設定</div>
        <button class="close-btn" onclick="closeModal('settings-modal')">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <label class="setting-label">音声・音量設定</label>
          <input type="range" class="setting-slider" min="0" max="100" value="80">
        </div>
        <div class="setting-item">
          <label class="setting-label">フォントサイズ</label>
          <div class="font-size-options">
            <span>小</span>
            <span>中</span>
            <span>大</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 3. 面接画面 ===== -->
  <div class="interview-container hidden" id="interview-screen">
    <div class="interview-header">
      <div class="header-info">
        <div class="mode-title">模擬面接モード</div>
        <div class="difficulty-badge">Normal</div>
      </div>
    </div>

    <div class="interview-main">
      <div class="speech-bubble">
        <div class="bubble-header">面接官</div>
        <div class="bubble-content">それでは、これまでの経歴と自己紹介をお願いします。</div>
      </div>
      <div class="interviewer-avatar">
        <!-- アバター画像 (必要に応じてパスを変更してください) -->
        <img src="character-base.png" alt="ベース" class="character-base">
        <img src="character-mouth.png" alt="口" class="character-mouth">
      </div>
    </div>

    <div class="interview-footer">
      <div class="progress-section">
        <div class="progress-boxes">
          <div class="step-box active">1</div>
          <div class="step-box">2</div>
          <div class="step-box">3</div>
        </div>
        <div class="progress-text">第1問 / 全3問</div>
      </div>

      <div class="input-section">
        <div class="input-controls">
          <textarea id="user-input" placeholder="回答を入力してください..."></textarea>
          <button class="send-btn">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 4. 単語帳モード ===== -->
  <div class="full-screen-container hidden" id="vocab-screen">
    <h2 class="difficulty-title">単語帳モード</h2>
    <p class="page-lead">用語をクリックして詳細な解説を確認しましょう。</p>
    
    <div class="vocab-list">
      <div class="vocab-item">
        <details>
          <summary class="vocab-word">フェーズ1: 導入・アイスブレイク</summary>
          <div class="vocab-body">
            面接官との最初のコミュニケーションです。笑顔とハッキリとした挨拶で好印象を与えましょう。
          </div>
        </details>
      </div>
      <div class="vocab-item">
        <details>
          <summary class="vocab-word">フェーズ2: 深掘り質問</summary>
          <div class="vocab-body">
            実績やこれまでの行動特性について、具体的なエピソードを交えて論理的に説明するフェーズです。
          </div>
        </details>
      </div>
    </div>

    <a href="#" class="back-link" onclick="switchScreen('top-screen')">← トップに戻る</a>
  </div>

  <!-- ===== 5. 並び替えモード ===== -->
  <div class="full-screen-container hidden" id="ordering-screen">
    <h2 class="difficulty-title">並び替えモード</h2>
    <p class="page-lead">カードを正しい手順のスロットに配置してください。</p>
    
    <div class="card-bank">
      <div class="source-card"><img src="card1.png" class="card-img" alt="手順1"></div>
      <div class="source-card"><img src="card2.png" class="card-img" alt="手順2"></div>
    </div>

    <div class="slots-container">
      <div class="order-slot">
        <span class="slot-number">1</span>
        <div class="slot-content"></div>
      </div>
      <div class="order-slot">
        <span class="slot-number">2</span>
        <div class="slot-content"></div>
      </div>
    </div>

    <div class="ordering-actions">
      <button class="ordering-reset">リセット</button>
      <button class="ordering-check">判定する</button>
    </div>
    <div class="ordering-result" id="ordering-result"></div>

    <a href="#" class="back-link" onclick="switchScreen('top-screen')">← トップに戻る</a>
  </div>

  <!-- 画面切り替え用の簡易スクリプト（動作確認用） -->
  <script>
    function switchScreen(screenId) {
      document.querySelectorAll('.main-container, .interview-container, .full-screen-container').forEach(el => {
        el.classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }
    function openModal(modalId) {
      document.getElementById(modalId).classList.remove('hidden');
    }
    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }
  </script>
</body>
</html>
